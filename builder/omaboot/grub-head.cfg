# OmaBoot? dev builds: our palette, font and wordmark (builder/omaboot). These files are on the
# ISO volume, not in GRUB's built-in memdisk that ${prefix} points at, so reach them through the
# ISO device the embedded config found (${ARCHISO_HINT}). GRUB script has no &&: nest the ifs.
insmod png
insmod gfxmenu
insmod gfxterm_background
set omaboot_grub="(${ARCHISO_HINT})/boot/grub"
export omaboot_grub # menu entries only see exported variables
if loadfont "${omaboot_grub}/fonts/omaboot-v24.pf2"; then
    if loadfont "${omaboot_grub}/fonts/omaboot-v16.pf2"; then
        set theme="${omaboot_grub}/themes/omaboot/theme.txt"
        export theme
    fi
fi

# Enable serial console (not on EFI: Macs have no com0, and the error makes GRUB pause)
if [ "${grub_platform}" != 'efi' ]; then
    insmod serial
    insmod usbserial_common
    insmod usbserial_ftdi
    insmod usbserial_pl2303
    insmod usbserial_usbdebug
    if serial --unit=0 --speed=115200; then
        terminal_input --append serial
        terminal_output --append serial
    fi
fi

