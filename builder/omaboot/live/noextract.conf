# Files the live edition doesn't unpack from the packages it keeps (pacman's NoExtract, added to the
# image's pacman config by builder/build-iso.sh): translations other than English (the tester carries
# its own), manuals and docs, and firmware for hardware no Intel Mac has. Later patterns win, so a !
# after a pattern keeps what it names. check-live-image.sh fails the build if a driver for any
# PCI or USB ID in mac-hardware-ids.txt asks for a firmware file left out here.
NoExtract = usr/share/locale/* !usr/share/locale/en/* !usr/share/locale/en_*/* !usr/share/locale/locale.alias
NoExtract = usr/share/man/* usr/share/doc/* usr/share/info/* usr/share/gtk-doc/* usr/share/help/* !usr/share/help/C/*
# Intel: Wi-Fi (iwlwifi), SOF audio DSPs, IPU cameras, vision and sensor hubs (Macs have none of them)
NoExtract = usr/lib/firmware/intel/iwlwifi/* usr/lib/firmware/intel/sof* usr/lib/firmware/intel/ipu/* usr/lib/firmware/intel/vsc/* usr/lib/firmware/intel/ish/*
# Intel Xe graphics (2024 and later)
NoExtract = usr/lib/firmware/xe/*
# NVIDIA GSP firmware for Turing and later GPUs (2018 on; Macs stop at Kepler)
NoExtract = usr/lib/firmware/nvidia/tu1* usr/lib/firmware/nvidia/ga1* usr/lib/firmware/nvidia/ad1* usr/lib/firmware/nvidia/gh1* usr/lib/firmware/nvidia/gb1* usr/lib/firmware/nvidia/gb2*
# Qualcomm Wi-Fi 5, 6 and 7 cards (PCIe)
NoExtract = usr/lib/firmware/ath10k/* usr/lib/firmware/ath11k/* usr/lib/firmware/ath12k/*
# Server and embedded network controllers, SoC firmware
NoExtract = usr/lib/firmware/dpaa2/* usr/lib/firmware/cxgb4/* usr/lib/firmware/bnx2x/* usr/lib/firmware/ti-connectivity/* usr/lib/firmware/nxp/* usr/lib/firmware/amlogic/* usr/lib/firmware/meson/* usr/lib/firmware/amdnpu/*
