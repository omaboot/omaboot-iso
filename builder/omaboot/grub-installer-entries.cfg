# Set default menu entry
default=omaboot-live
timeout=5
timeout_style=menu


# Menu entries

menuentry "OmaBoot? Live: test this Mac" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live' {
    # Loading screen while GRUB reads the kernel and initramfs (10+ s from a USB 2 stick), then
    # black just before the handover, so the kernel's graphics takeover has no leftover image to
    # show sheared (the stock ISO's screen is black there too).
    if [ -n "${theme}" ]; then
        background_image -m stretch "${omaboot_grub}/themes/omaboot/loading.png"
        clear
        sleep --interruptible 4
    fi
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash boot.live=1 xe.enable_panel_replay=0 initramfs_async=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
    if [ -n "${theme}" ]; then
        background_color black
        clear
    fi
}

