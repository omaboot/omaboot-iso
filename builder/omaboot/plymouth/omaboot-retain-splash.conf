# OmaBoot? Live: plymouth-quit leaves the splash's last frame on screen (--retain-splash) instead
# of blanking it, so the screen isn't black between the splash and boot-live's first frame (tty1's
# autologin doesn't clear the screen, and the image has no login message). Installed by
# build-hooks.sh as /etc/systemd/system/plymouth-quit.service.d/omaboot-retain-splash.conf.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
