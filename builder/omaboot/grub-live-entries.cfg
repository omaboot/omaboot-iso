# Troubleshooting entries sit one level down: the boot messages instead of the splash, and
# forcing a kernel.
submenu "OmaBoot? Live: more options…" --id 'omaboot-live-kernel' {
    menuentry "Show boot messages (no splash)" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live-verbose' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${omaboot_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% plymouth.enable=0 omaboot.live=1 ${omaboot_args} copytoram=n xe.enable_panel_replay=0 initramfs_async=0
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${omaboot_kernel}.img
    }

    menuentry "T2 kernel (2018–2020 Macs with a T2 chip)" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live-t2' {
        if [ -n "${theme}" ]; then
            background_image -m stretch "${omaboot_grub}/themes/omaboot/loading.png"
            clear
            sleep --interruptible 4
        fi
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-t2 archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash omaboot.live=1 ${omaboot_args} copytoram=n xe.enable_panel_replay=0 initramfs_async=0
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-t2.img
        if [ -n "${theme}" ]; then
            background_color black
            clear
        fi
    }

    menuentry "Standard kernel (Macs without a T2 chip)" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live-omarchy' {
        if [ -n "${theme}" ]; then
            background_image -m stretch "${omaboot_grub}/themes/omaboot/loading.png"
            clear
            sleep --interruptible 4
        fi
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-omarchy archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash omaboot.live=1 ${omaboot_args} copytoram=n xe.enable_panel_replay=0 initramfs_async=0
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-omarchy.img
        if [ -n "${theme}" ]; then
            background_color black
            clear
        fi
    }
}

