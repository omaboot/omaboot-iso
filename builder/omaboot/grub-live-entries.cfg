    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${omaboot_kernel}.img
    if [ -n "${theme}" ]; then
        background_color black
        clear
    fi
}

menuentry "OmaBoot? Live: safe graphics (nomodeset)" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live-nomodeset' {
    if [ -n "${theme}" ]; then
        background_image -m stretch "${omaboot_grub}/themes/omaboot/loading.png"
