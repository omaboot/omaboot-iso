    fi
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${omaboot_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset omaboot.live=1 ${omaboot_args} copytoram=n xe.enable_panel_replay=0 initramfs_async=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${omaboot_kernel}.img
