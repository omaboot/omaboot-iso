# OmaBoot? Live stand-alone image (OMABOOT_FLAVOUR=live; build-iso.sh puts this in place of the
# installer's menu entries). Boot each Mac with the kernel an Omarchy install would give it: the
# installer picks linux-t2 only when it sees the T2 chip, so pick by the SMBIOS model name here.
# Not a T2 model, or no SMBIOS (QEMU): linux-omarchy.
# The entries read the system from the stick as needed (copytoram=n: archiso would otherwise copy
# all of it into RAM first, a minute over USB 2); "copy to RAM" does that, so the stick can come out.
insmod smbios
insmod regexp
set omaboot_kernel=linux-omarchy
set omaboot_kernel_name="standard kernel"
if smbios --type 1 --get-string 5 --set omaboot_model; then
    if regexp '^(MacBookPro1[56],|MacBookAir(8|9),|Macmini8,|iMac20,|iMacPro1,|MacPro7,)' "${omaboot_model}"; then
        set omaboot_kernel=linux-t2
        set omaboot_kernel_name="T2 kernel"
    fi
fi
export omaboot_kernel
export omaboot_kernel_name
export omaboot_model

# Per-Mac kernel options, the same an install's OmaBoot? fix sets. iMac10,1 (Radeon HD 4670, RV730):
# with radeon's defaults (dpm, PCIe gen 2, UVD on) UVD fails at boot and the GPU locks up under
# load; omarchy-vintage-intel-imac-fix boots with these three. Harmless on the 9400M model.
set omaboot_args=""
if regexp '^iMac10,1 *$' "${omaboot_model}"; then
    set omaboot_args="radeon.dpm=0 radeon.pcie_gen2=0 radeon.uvd=0"
fi
export omaboot_args

default=omaboot-live
timeout=5
timeout_style=menu


# Menu entries. Each shows the loading splash for at least 4 s (a key skips the wait): Boot says
# hello, and older Macs can then show a black screen for minutes before the next splash.

menuentry "OmaBoot? Live: test this Mac (${omaboot_kernel_name})" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live' {
    if [ -n "${theme}" ]; then
        background_image -m stretch "${omaboot_grub}/themes/omaboot/loading.png"
        clear
        sleep --interruptible 4
    fi
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-${omaboot_kernel} archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash omaboot.live=1 ${omaboot_args} copytoram=n xe.enable_panel_replay=0 initramfs_async=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-${omaboot_kernel}.img
    if [ -n "${theme}" ]; then
        background_color black
        clear
    fi
}

menuentry "OmaBoot? Live: copy to RAM, frees the stick" --class arch --class gnu-linux --class gnu --class os --id 'omaboot-live-copytoram' {
    if [ -n "${theme}" ]; then
