# OmaBoot? Live release dry run on GitHub's runners (manual runs only): the same build as a release
# tag (.github/workflows/release.yml -> builder/omaboot/release/build.sh), from the branch it's run
# on, with boot-live from a branch or tag of its public repo, and no secrets: no report target (the
# image saves reports to the stick), no bug report key, no draft release, nothing published. Its
# reports, smoke tests and the disk and time it took stay a workflow artifact for 14 days.
name: release-dryrun
on:
  workflow_dispatch:
    inputs:
      boot_live_ref:
        description: "boot-live branch or tag (github.com/omaboot/boot-live)"
        default: main
permissions:
  contents: read
concurrency:
  group: release-dryrun
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the difference report reads the fork's history back to the official commit
      # (by hand rather than a third-party action: the repo runs GitHub's own actions only)
      - name: free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          sudo swapoff -a && sudo rm -f /mnt/swapfile
          df -h /
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf mtools dosfstools
          ls -l /dev/kvm /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_VARS_4M.fd
          sudo mkdir -p /mnt/omaboot && sudo chown "$(id -u):$(id -g)" /mnt/omaboot
          df -h / /mnt
      - name: build, smoke-test, compare (dry run)
        env:
          BOOT_LIVE_TAG: ${{ inputs.boot_live_ref }}
          BOOT_LIVE_ALLOW_BRANCH: "1"
        run: |
          export OMABOOT_TAG=dryrun-${{ github.run_number }} OUT=/mnt/omaboot/out OMABOOT_OFFICIAL_CACHE=/mnt/omaboot/official
          # the disk at its fullest, every 30 s, for the record
          ( while sleep 30; do df -B1M --output=used,avail / /mnt | tail -n +2 | tr '\n' ' '; echo; done >/mnt/omaboot/disk.log ) &
          watch=$!
          start=$(date +%s)
          set +e
          builder/omaboot/release/build.sh
          status=$?
          set -e
          kill "$watch" 2>/dev/null || true
          mkdir -p "$OUT"
          {
            echo "build.sh exit $status after $(( ($(date +%s) - start) / 60 )) min"
            echo "disk at its fullest (MiB: / used, / free, /mnt used, /mnt free): $(sort -n -k2 /mnt/omaboot/disk.log | head -n1)"
            df -h / /mnt
          } | tee /mnt/omaboot/out/runner.txt >>"$GITHUB_STEP_SUMMARY"
          exit $status
      - name: keep the reports, smoke tests and disk record (also when the build failed)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dryrun-${{ github.run_number }}
          path: |
            /mnt/omaboot/out/*
            !/mnt/omaboot/out/*.iso
            /mnt/omaboot/disk.log
          retention-days: 14
          if-no-files-found: ignore
